<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/front-end/style/style.css">
    <title>Cadastro</title>
</head>
<body>
    <!-- Cabeçalho -->
    <nav class="navbar">
        <div>
            <a href="index.html" class="navitem">Home</a>
            <a href="cadastro.html" class="navitem">Cadastro</a>
            <a href="tabela.html" class="navitem">Tabelas</a>
            <a href="login.html" class="navitem">Login</a>
        </div>
    </nav>
    <!-- Fim cabeçalho -->

    <!-- Formulario -->
     <form action="" method="post">
        <div class="base">
            <div class="forms">
                <div class="item-forms">
                    <h2>Cadastro</h2>
                    <p class="t-forms">
                        <p class="text-forms"><label>Edição:</label></p>
                        <input type="email" name="text" id="email" placeholder="Digite seu Email" class="input-forms">
                    </p>
                    <p class="t-forms">
                       <p class="text-forms"><label>Nome da carta (Inglês):</label></p> 
                        <input type="password" name="password" id="password" placeholder="Digite sua Senha" class="input-forms">
                    </p>
                    <p class="t-forms">
                       <p class="text-forms"><label>Nome da carta (PT-BR):</label></p> 
                        <input type="password" name="password" id="password" placeholder="Digite sua Senha" class="input-forms">
                    </p>
                    <input class="button" type="button" value="Enviar">
                </div>
            </div>
        </div>
     </form>
     <!-- Fim formulario -->
</body>
</html>
